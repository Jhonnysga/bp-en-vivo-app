name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          CT=$(echo "$ANDROID_SDK_ROOT/cmdline-tools/"*/ | head -1)
          echo "cmdline-tools: $CT"
          yes | "${CT}bin/sdkmanager" --licenses > /dev/null || true
          "${CT}bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APKs (bplay + truenotv)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/*/*/*.apk
          retention-days: 30

      - name: Verify APKs
        run: |
          for APK in app/build/outputs/apk/*/*/*.apk; do
            echo "$APK: $(du -h $APK | cut -f1)"
          done
