plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jhonnysga.bpenvivo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jhonnysga.bpenvivo'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.5.0'
        // URL base del backend (index.php + proxy.php). Cambiar aquí para
        // apuntar a otro servidor y recompilar.
        buildConfigField("String", "BACKEND_URL", "\"https://jhon-pc.tailc7b9f2.ts.net\"")
    }

    buildTypes {
        debug {
            // APK debug: firmada con la clave de depuración, lista para instalar.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // MiTV (Thundernet TV GO / Setplex): HTTP + almacenamiento cifrado de sesión.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0'
}
