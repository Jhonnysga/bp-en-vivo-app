plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jhonnysga.bpenvivo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jhonnysga.bpenvivo'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName '3.0.0'
        // v2.0: sin backend. La app extrae los streams directo de
        // Dailymotion en el dispositivo (misma IP pide y reproduce).
    }

    // Dos APKs del mismo código: bplay (BéisbolPlay) y truenotv
    // (Thundernet TV GO). Cada sabor muestra solo su fuente.
    flavorDimensions "app"
    productFlavors {
        bplay {
            dimension "app"
            applicationId 'com.jhonnysga.bpenvivo'
            manifestPlaceholders = [appName: "bplay"]
        }
        truenotv {
            dimension "app"
            applicationId 'com.jhonnysga.truenotv'
            manifestPlaceholders = [appName: "TruenoTv"]
        }
    }

    buildTypes {
        debug {
            // APK debug: firmada con la clave de depuración, lista para instalar.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    // Red resiliente: DNS normal + respaldo DNS-over-HTTPS (Cloudflare)
    // por si el operador bloquea o falla el DNS.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    // Credenciales Thundernet cifradas en el dispositivo
    implementation 'androidx.security:security-crypto:1.1.0'
}
